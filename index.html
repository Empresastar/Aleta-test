<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Host Monitor - Som Fixo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #0f172a; --neon: #38bdf8; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        
        .sidebar { width: 260px; background: #020617; padding: 25px; border-right: 1px solid #1e293b; }
        .main { flex: 1; padding: 40px; overflow-y: auto; background: #050505; }
        .feed { max-width: 650px; margin: 0 auto; }

        .alert-card { 
            background: var(--card); border: 1px solid #1e293b; border-radius: 16px; 
            padding: 20px; margin-bottom: 20px; border-left: 5px solid var(--neon);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); animation: pop 0.3s ease;
        }
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .btn-blue { 
            display: inline-block; margin-top: 15px; padding: 12px 24px; 
            background: var(--neon); color: #000; font-weight: bold; 
            border-radius: 8px; text-decoration: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .status-on { color: #10b981; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3 style="color:var(--neon)">SISTEMA ATIVO</h3>
    <p>Status: <span class="status-on">● ONLINE</span></p>
    <p style="font-size: 0.8rem; color: #64748b;">ID de Conexão:<br><b style="color:white">meu-host-fixo-p2p</b></p>
    <hr style="border:0; border-top:1px solid #1e293b; margin: 20px 0;">
    <button onclick="testarSom()" style="width:100%; padding:10px; cursor:pointer; background:#1e293b; color:white; border:1px solid #334155; border-radius:5px;">🔈 Testar Som</button>
</div>

<div class="main">
    <div class="feed" id="feed">
        <h1 style="color: var(--neon)">Alertas Recebidos</h1>
        <p id="vazio" style="color:#475569">Aguardando chamado do chefe...</p>
    </div>
</div>

<audio id="audioPlayer" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    const audio = document.getElementById('audioPlayer');
    const peer = new Peer('meu-host-fixo-p2p');

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            // Tocar som fixo
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Clique na página para ativar o som"));

            // Remover texto de vazio
            if(document.getElementById('vazio')) document.getElementById('vazio').remove();

            // Criar o Card
            const feed = document.getElementById('feed');
            const card = document.createElement('div');
            card.className = 'alert-card';
            
            let botaoAzul = '';
            if(data.url) {
                const textoBotao = data.tipo === 'pdf' ? 'ABRIR DOCUMENTO PDF' : 'VER VÍDEO / LINK';
                botaoAzul = `<a href="${data.url}" target="_blank" class="btn-blue">${textoBotao}</a>`;
            }

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.75rem; color:var(--neon)">
                    <span>⚠️ NOVO ALERTA</span>
                    <span>${new Date().toLocaleTimeString()}</span>
                </div>
                <p style="font-size:1.1rem; margin:0;">${data.texto}</p>
                ${botaoAzul}
            `;
            feed.prepend(card);
        });
    });

    function testarSom() { audio.play(); }
</script>
</body>
</html>
